# Ambiente local: emuladores do Azure Storage (Azurite) e do Cosmos DB.
# Uso: docker compose up -d   (depois: mvn package && cd target/azure-functions/feedback-functions && func start)
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"   # Blob
      - "10001:10001"   # Queue
      - "10002:10002"   # Table

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    command: --protocol https
    ports:
      - "8081:8081"     # endpoint
      - "1234:1234"     # Data Explorer: http://localhost:1234

# ----------------------------------------------------------------------------
# Plataforma de Feedback - configuração Quarkus
# Em produção, cada propriedade é sobrescrita por uma App Setting da Function App
# (ex.: cosmos.endpoint <- COSMOS_ENDPOINT), definida em infra/main.bicep.
# ----------------------------------------------------------------------------

# Nome do pacote gerado em target/azure-functions/<app-name>
quarkus.azure-functions.app-name=feedback-functions

# Cosmos DB (API NoSQL, serverless)
cosmos.endpoint=https://localhost:8081
cosmos.database=feedback
cosmos.container=avaliacoes
# cosmos.key -> somente local (emulador). Em produção: Managed Identity.

# Blob Storage (relatórios)
blob.container=relatorios
# blob.endpoint / blob.connection-string -> via App Settings

# E-mail: provedor = smtp (Gmail, padrão em produção) | acs (Azure Communication Services) | log (só registra no log)
email.provedor=log
# email.destinatarios -> via App Settings (EMAIL_DESTINATARIOS)

# SMTP (extensão quarkus-mailer). Usuário, senha e remetente vêm das App Settings:
# QUARKUS_MAILER_USERNAME, QUARKUS_MAILER_PASSWORD (Key Vault), QUARKUS_MAILER_FROM
quarkus.mailer.host=smtp.gmail.com
# Gmail: porta 465 com TLS direto
quarkus.mailer.port=465
quarkus.mailer.tls=true
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.login=REQUIRED
# Restringe os métodos de login: com XOAUTH2 (padrão oferecido pelo Gmail) a senha de app é recusada
quarkus.mailer.auth-methods=PLAIN LOGIN
# Não reaproveita conexões (o Gmail encerra conexões ociosas entre execuções da função)
quarkus.mailer.keep-alive=false
quarkus.mailer.mock=false

# ACS (alternativa): email.connection-string, email.remetente -> via App Settings

quarkus.log.level=INFO
quarkus.log.category."com.azure".level=WARN
quarkus.banner.enabled=false
